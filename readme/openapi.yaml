openapi: 3.0.3
info:
  title: magicOculus API
  version: 1.0.0
  description: 'API статистики турниров Magic: The Gathering (Россия): справочники,
    турниры, игроки, колоды, витрины и импорт результатов.'
paths:
  /api/v1/admin/imports/daily:
    post:
      operationId: imports_daily_create
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyImportRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSuccess'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFailure'
          description: ''
  /api/v1/admin/imports/tournament:
    post:
      operationId: imports_tournament_create
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TournamentImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TournamentImportRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSuccess'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFailure'
          description: ''
  /api/v1/admin/imports/tournament/melee:
    post:
      operationId: imports_tournament_melee_create
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeleeTournamentImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeleeTournamentImportRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSuccess'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFailure'
          description: ''
  /api/v1/admin/tournaments/import:
    post:
      operationId: admin_tournaments_import_create
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSuccess'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFailure'
          description: ''
  /api/v1/cities:
    get:
      operationId: cities_list
      tags:
      - cities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/v1/cities/{city_code}/clubs:
    get:
      operationId: cities_clubs_list
      parameters:
      - in: path
        name: city_code
        schema:
          type: string
        required: true
      tags:
      - cities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Club'
          description: ''
  /api/v1/decks:
    get:
      operationId: decks_list
      parameters:
      - in: query
        name: cityId
        schema:
          type: string
        description: code города
      - in: query
        name: clubId
        schema:
          type: string
        description: code клуба
      - in: query
        name: dateFrom
        schema:
          type: string
          format: date
        description: YYYY-MM-DD
      - in: query
        name: dateTo
        schema:
          type: string
          format: date
        description: YYYY-MM-DD
      - in: query
        name: formatId
        schema:
          type: string
        description: code формата
      - in: query
        name: leagueId
        schema:
          type: integer
        description: id лиги
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - bestRank_asc
          - matchWinRate_desc
          - matchesCount_desc
          - name_asc
          - playersCount_desc
      - in: query
        name: tournamentType
        schema:
          type: string
          enum:
          - daily
          - tournament
      tags:
      - decks
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeckListItemList'
          description: ''
  /api/v1/decks/{id}:
    get:
      operationId: decks_retrieve
      parameters:
      - in: query
        name: cityId
        schema:
          type: string
        description: code города
      - in: query
        name: clubId
        schema:
          type: string
        description: code клуба
      - in: query
        name: dateFrom
        schema:
          type: string
          format: date
        description: YYYY-MM-DD
      - in: query
        name: dateTo
        schema:
          type: string
          format: date
        description: YYYY-MM-DD
      - in: query
        name: formatId
        schema:
          type: string
        description: code формата
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: leagueId
        schema:
          type: integer
        description: id лиги
      - in: query
        name: tournamentType
        schema:
          type: string
          enum:
          - daily
          - tournament
      tags:
      - decks
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckDetail'
          description: ''
