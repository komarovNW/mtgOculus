      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeagueSummaryList'
          description: ''
  /api/v1/leagues/{id}:
    get:
      operationId: leagues_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: sort
        schema:
          type: string
        description: 'показатели через запятую, порядок убывания: tournamentPoints,
          bonusPoints, tournamentsPlayed, xZeroCount, xOneCount'
      tags:
      - leagues
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
          description: ''
  /api/v1/leagues/options:
    get:
      operationId: leagues_options_list
      description: 'Лиги для выбора при заведении турнира: без счётчиков и пагинации.'
      parameters:
      - in: query
        name: cityId
        schema:
          type: string
        description: code города
      - in: query
        name: clubId
        schema:
          type: string
        description: code клуба
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: 'YYYY-MM-DD, дата турнира: лиги, в период которых она попадает'
      - in: query
        name: formatId
        schema:
          type: string
        description: code формата
      tags:
      - leagues
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueOption'
          description: ''
  /api/v1/leagues/qualifiers/options:
    get:
      operationId: leagues_qualifiers_options_list
      description: Не привязанные отборочные для выбора при заливке турнира.
      parameters:
      - in: query
        name: leagueId
        schema:
          type: integer
        description: 'id лиги: только её отборочные'
      tags:
      - leagues
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
