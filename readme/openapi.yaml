        description: code клуба
      - in: query
        name: dateFrom
        schema:
          type: string
          format: date
        description: YYYY-MM-DD
      - in: query
        name: dateTo
        schema:
          type: string
          format: date
        description: YYYY-MM-DD
      - in: query
        name: formatId
        schema:
          type: string
        description: code формата
        required: true
      - in: query
        name: leagueId
        schema:
          type: integer
        description: id лиги
      - in: query
        name: top
        schema:
          type: integer
        description: число колод в матрице, 2–40 (дефолт 15)
      - in: query
        name: tournamentType
        schema:
          type: string
          enum:
          - daily
          - tournament
      tags:
      - matchups
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchupMatrix'
          description: ''
  /api/v1/ping:
