components:
  schemas:
    AppliedFilters:
      type: object
      description: |-
        Нормализованный набор применённых фильтров (`resolve_filters().applied`).

        Все поля опциональны — в ответе присутствуют только заданные фильтры.
        Используется только для схемы: рантайм отдаёт сырой `ctx.applied`.
      properties:
        city:
          $ref: '#/components/schemas/Ref'
        club:
          $ref: '#/components/schemas/_AppliedClub'
        format:
          $ref: '#/components/schemas/Ref'
        tournamentType:
          type: string
        dateFrom:
          type: string
        dateTo:
          type: string
        league:
          $ref: '#/components/schemas/_AppliedLeague'
    City:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Отображаемое название
          maxLength: 100
        country:
          type: string
          description: Страна
          maxLength: 100
      required:
      - id
      - name
    Club:
      type: object
      properties:
        id:
          type: string
        cityId:
          type: string
        name:
          type: string
          description: Название клуба
          maxLength: 120
      required:
      - cityId
      - id
      - name
    CodeEnum:
      enum:
      - INVALID_DATE
      - INVALID_CITY
      - INVALID_CLUB
      - CLUB_DOES_NOT_BELONG_TO_CITY
      - INVALID_TOURNAMENT_TYPE
      - INVALID_FORMAT
      - FINAL_STANDINGS_FILE_REQUIRED
      - ALL_ROUNDS_FILE_REQUIRED
      - PLAYER_DECKS_TEXT_REQUIRED
      - FINAL_STANDINGS_PARSE_ERROR
      - ALL_ROUNDS_PARSE_ERROR
      - PLAYER_DECKS_PARSE_ERROR
      - DECK_NUMBERING_MISMATCH
      - DECK_COUNT_MISMATCH
      - STANDING_PLAYER_WITHOUT_DECK
      - DECK_PLAYER_NOT_FOUND_IN_STANDINGS
      - ROUND_PLAYER_NOT_FOUND_IN_STANDINGS
      - INVALID_MATCH_SCORE
      - DUPLICATE_PLAYER_IN_STANDINGS
      - DUPLICATE_DECK_ENTRY
      - DUPLICATE_TABLE_IN_ROUND
      - PLAYER_PLAYS_TWICE_IN_ROUND
      - DUPLICATE_TOURNAMENT
      - MISSING_IMPORT_SOURCE
      - AETHERHUB_FETCH_ERROR
      - AETHERHUB_PARSE_ERROR
      - AETHERHUB_TOURNAMENT_INCOMPLETE
      - LEAGUE_NOT_FOUND
      - LEAGUE_MISMATCH
      - PLAYOFF_REQUIRED
      - PLAYOFF_CONFLICTS_WITH_NO_PLAYOFF
      - PLAYOFF_PLAYER_NOT_FOUND_IN_STANDINGS
      - INVALID_PLAYOFF_BRACKET
      - PLAYOFF_MATCH_WITHOUT_WINNER
      - DECKS_ORDER_REQUIRED
      - MELEE_FETCH_ERROR
      - MELEE_PARSE_ERROR
      - MELEE_TOURNAMENT_INCOMPLETE
      - MELEE_UNSUPPORTED_TOURNAMENT
      - LEAGUE_QUALIFIER_NOT_FOUND
      - LEAGUE_QUALIFIER_TAKEN
      - DECKS_LINKED_POSITIONALLY
      - PLAYER_NAME_NORMALIZED
      - PLAYER_NAME_SIMILAR_MATCH
      - DECK_NAME_NORMALIZED
      - NEW_PLAYERS_CREATED
      - NEW_DECKS_CREATED
      - ROUND_NUMBER_INFERRED_FROM_TABLE_RESET
      - MISSING_TIEBREAKERS
      - EXTERNAL_PLAYER_ID_IGNORED
      - ROUNDS_RECORD_MISMATCH
      - POINTS_RECORD_MISMATCH
      - AETHERHUB_FALLBACK_TO_CSV
      - PLAYOFF_PLAYER_OUTSIDE_SWISS_TOP
      type: string
      description: |-
        * `INVALID_DATE` - INVALID_DATE
        * `INVALID_CITY` - INVALID_CITY
        * `INVALID_CLUB` - INVALID_CLUB
        * `CLUB_DOES_NOT_BELONG_TO_CITY` - CLUB_DOES_NOT_BELONG_TO_CITY
        * `INVALID_TOURNAMENT_TYPE` - INVALID_TOURNAMENT_TYPE
        * `INVALID_FORMAT` - INVALID_FORMAT
        * `FINAL_STANDINGS_FILE_REQUIRED` - FINAL_STANDINGS_FILE_REQUIRED
        * `ALL_ROUNDS_FILE_REQUIRED` - ALL_ROUNDS_FILE_REQUIRED
        * `PLAYER_DECKS_TEXT_REQUIRED` - PLAYER_DECKS_TEXT_REQUIRED
        * `FINAL_STANDINGS_PARSE_ERROR` - FINAL_STANDINGS_PARSE_ERROR
        * `ALL_ROUNDS_PARSE_ERROR` - ALL_ROUNDS_PARSE_ERROR
        * `PLAYER_DECKS_PARSE_ERROR` - PLAYER_DECKS_PARSE_ERROR
        * `DECK_NUMBERING_MISMATCH` - DECK_NUMBERING_MISMATCH
        * `DECK_COUNT_MISMATCH` - DECK_COUNT_MISMATCH
        * `STANDING_PLAYER_WITHOUT_DECK` - STANDING_PLAYER_WITHOUT_DECK
        * `DECK_PLAYER_NOT_FOUND_IN_STANDINGS` - DECK_PLAYER_NOT_FOUND_IN_STANDINGS
        * `ROUND_PLAYER_NOT_FOUND_IN_STANDINGS` - ROUND_PLAYER_NOT_FOUND_IN_STANDINGS
        * `INVALID_MATCH_SCORE` - INVALID_MATCH_SCORE
        * `DUPLICATE_PLAYER_IN_STANDINGS` - DUPLICATE_PLAYER_IN_STANDINGS
        * `DUPLICATE_DECK_ENTRY` - DUPLICATE_DECK_ENTRY
        * `DUPLICATE_TABLE_IN_ROUND` - DUPLICATE_TABLE_IN_ROUND
        * `PLAYER_PLAYS_TWICE_IN_ROUND` - PLAYER_PLAYS_TWICE_IN_ROUND
        * `DUPLICATE_TOURNAMENT` - DUPLICATE_TOURNAMENT
        * `MISSING_IMPORT_SOURCE` - MISSING_IMPORT_SOURCE
        * `AETHERHUB_FETCH_ERROR` - AETHERHUB_FETCH_ERROR
        * `AETHERHUB_PARSE_ERROR` - AETHERHUB_PARSE_ERROR
        * `AETHERHUB_TOURNAMENT_INCOMPLETE` - AETHERHUB_TOURNAMENT_INCOMPLETE
        * `LEAGUE_NOT_FOUND` - LEAGUE_NOT_FOUND
        * `LEAGUE_MISMATCH` - LEAGUE_MISMATCH
        * `PLAYOFF_REQUIRED` - PLAYOFF_REQUIRED
        * `PLAYOFF_CONFLICTS_WITH_NO_PLAYOFF` - PLAYOFF_CONFLICTS_WITH_NO_PLAYOFF
        * `PLAYOFF_PLAYER_NOT_FOUND_IN_STANDINGS` - PLAYOFF_PLAYER_NOT_FOUND_IN_STANDINGS
        * `INVALID_PLAYOFF_BRACKET` - INVALID_PLAYOFF_BRACKET
        * `PLAYOFF_MATCH_WITHOUT_WINNER` - PLAYOFF_MATCH_WITHOUT_WINNER
        * `DECKS_ORDER_REQUIRED` - DECKS_ORDER_REQUIRED
        * `MELEE_FETCH_ERROR` - MELEE_FETCH_ERROR
        * `MELEE_PARSE_ERROR` - MELEE_PARSE_ERROR
        * `MELEE_TOURNAMENT_INCOMPLETE` - MELEE_TOURNAMENT_INCOMPLETE
        * `MELEE_UNSUPPORTED_TOURNAMENT` - MELEE_UNSUPPORTED_TOURNAMENT
        * `LEAGUE_QUALIFIER_NOT_FOUND` - LEAGUE_QUALIFIER_NOT_FOUND
